name: the_radar
description: "The Radar — Global Football Scouting Platform (Flutter Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  supabase_flutter: ^2.17.2
  gotrue: ^2.27.2
  functions_client: ^2.7.1
  realtime_client: ^2.13.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  file_picker: ^10.3.10
  video_thumbnail: ^0.5.6
  web: ^1.1.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Typography from the uploaded design spec (Nocturnal Athletic). Bundled
  # rather than fetched at runtime so the Pi Browser renders the exact same
  # faces offline.
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-700.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-800.ttf
          weight: 800
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
