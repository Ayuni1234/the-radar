name: Build & Deploy Web
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets aren't readable in step-level `if:`; map through job env.
      SUPABASE_TOKEN_SET: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Test gate: broken builds never publish. Excludes the OS-dependent
      # golden capture test (pixel goldens are generated on dev machines;
      # see dart_test.yaml for why).
      - name: Test
        run: flutter test --exclude-tags=golden-capture
      # Apply pending Supabase migrations (PitchMarket tables today, future
      # releases as they land in supabase/migrations) before publishing, so
      # the app never ships ahead of its schema. Skipped when the token
      # secret isn't configured. `yes |` defuses the interactive confirm
      # (non-TTY runs auto-accept, belt-and-suspenders for CLI updates).
      - name: Apply Supabase migrations
        if: env.SUPABASE_TOKEN_SET == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: yes | npx --yes supabase db push --project-ref wmadurjharulfyyzzyes
      - run: flutter build web --release --wasm --base-href "/the-radar/" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      # A service worker from an older bundle outlives a deploy and keeps
      # serving its precached index.html against the freshly published wasm;
      # the two disagree and the app boots to a blank dark canvas until the
      # user hard-refreshes. Replace Flutter's precaching worker with an inert
      # one: browsers that still hold the old worker pick this up (same URL),
      # drop the stale caches and stop intercepting fetches, so the next load
      # is served fresh. web/index.html also unregisters it outright.
      - name: Neutralise the service worker cache
        run: |
          cat > build/web/flutter_service_worker.js <<'JS'
          // The Radar — cacheless service worker. See the deploy workflow.
          self.addEventListener('install', function () { self.skipWaiting(); });
          self.addEventListener('activate', function (event) {
            event.waitUntil((async function () {
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map(function (k) { return caches.delete(k); }));
              } catch (e) {}
            })());
          });
          JS
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: web-deploy
