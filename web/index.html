<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is the directory the page was actually served from, not the
    one the bundle was built for. A build-time href only knows where the app
    was *built* to live: the bundle is served from the site root on a dev
    server but from the /the-radar/ project path on GitHub Pages — which is
    what the Pi container at radarvr7995.pinet.com iframes. A bundle built for
    "/" and published there 404s every URL below it (no main.dart.js, no
    widgets, just the dark page background). Emitting the base inline, before
    anything else is parsed, keeps any host path working. The token in the
    comment is what `flutter build web --base-href` rewrites; the URL is
    resolved at runtime.
  -->
  <!-- $FLUTTER_BASE_HREF -->
  <script>
    (function () {
      var path = window.location.pathname;
      // Directory of the current document, collapsed to a single trailing
      // slash (the Pi container iframes this page with a doubled one).
      var dir = path.substring(0, path.lastIndexOf('/') + 1).replace(/\/+$/, '/');
      document.write('<base href="' + (dir || '/') + '">');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Radar — Global Football Scouting Platform. Live sessions, scouting, and Pi-powered payments.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Radar — Global Football Scouting Platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pi Network SDK: must be loaded before the Flutter app boots. -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Expose a flag the Dart bridge can read to detect a working Pi environment.
    window.addEventListener('error', function (e) {
      if (window.__radarJsErrors && e && e.message) {
        window.__radarJsErrors.push(String(e.message));
      }
    });
    if (!window.__radarJsErrors) {
      window.__radarJsErrors = [];
    }
    // Bootstrap background matches the dark palette ink (#1A1230) so the very
    // first painted frame already looks like the app, with no flash.
    document.documentElement.style.backgroundColor = '#1A1230';
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
