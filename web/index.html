<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is the directory the page was actually served from, not the
    one the bundle was built for. A build-time href only knows where the app
    was *built* to live: the bundle is served from the site root on a dev
    server but from the /the-radar/ project path on GitHub Pages — which is
    what the Pi container at radarvr7995.pinet.com iframes. A bundle built for
    "/" and published there 404s every URL below it (no main.dart.js, no
    widgets, just the dark page background). Emitting the base inline, before
    anything else is parsed, keeps any host path working. The token in the
    comment is what `flutter build web --base-href` rewrites; the URL is
    resolved at runtime.
  -->
  <!-- $FLUTTER_BASE_HREF -->
  <script>
    (function () {
      var path = window.location.pathname;
      // Directory of the current document, collapsed to a single trailing
      // slash (the Pi container iframes this page with a doubled one).
      var dir = path.substring(0, path.lastIndexOf('/') + 1).replace(/\/+$/, '/');
      document.write('<base href="' + (dir || '/') + '">');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Radar — Global Football Scouting Platform. Live sessions, scouting, and Pi-powered payments.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Radar — Global Football Scouting Platform</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Evict any previously installed Flutter service worker.

    The build ships with --pwa-strategy=none (see the deploy workflow) because
    a service worker caches index.html and the wasm bundle separately: after a
    deploy the two can disagree and the app boots to a blank dark canvas until
    the user hard-refreshes. Devices that still hold the old worker — and the
    old index.html it serves — never see this file, so this cleanup also runs
    from the stale copy: unregister, drop the caches, and reload once with the
    cache gone.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator) && !window.caches) return;
      var reloaded = 'radarSwPurged';
      try {
        if (sessionStorage.getItem(reloaded) === '1') return;
      } catch (e) {
        return;
      }
      var hadWorker = false;
      var done = function () {
        if (!hadWorker) return;
        try { sessionStorage.setItem(reloaded, '1'); } catch (e) {}
        window.location.reload();
      };
      var cleanup = Promise.resolve();
      if ('serviceWorker' in navigator) {
        cleanup = navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              hadWorker = regs.length > 0;
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .catch(function () {});
      }
      cleanup.then(function () {
        if (!window.caches) return done();
        return caches.keys()
            .then(function (keys) {
              hadWorker = hadWorker || keys.length > 0;
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
            .then(done)
            .catch(done);
      });
    })();
  </script>

  <!-- Pi Network SDK: must be loaded before the Flutter app boots. -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Expose a flag the Dart bridge can read to detect a working Pi environment.
    window.addEventListener('error', function (e) {
      if (window.__radarJsErrors && e && e.message) {
        window.__radarJsErrors.push(String(e.message));
      }
    });
    if (!window.__radarJsErrors) {
      window.__radarJsErrors = [];
    }
    // Bootstrap background matches the dark palette ink (#1A1230) so the very
    // first painted frame already looks like the app, with no flash.
    document.documentElement.style.backgroundColor = '#1A1230';
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Boot watchdog. A blank dark page is the worst failure mode this app has:
    nothing to tap, nothing to read, no way to tell a slow load from a broken
    one. If Flutter has not painted a canvas after 20s, show a plain-DOM panel
    with a Reload button instead of leaving the viewport empty. It removes
    itself the moment the engine paints.
  -->
  <script>
    (function () {
      // The engine builds its scene host inside the glass pane's shadow root,
      // so a plain querySelector never sees it: walk in explicitly.
      var painted = function () {
        var view = document.querySelector('flutter-view');
        if (!view) return false;
        if (view.querySelector('canvas')) return true;
        var pane = view.querySelector('flt-glass-pane');
        var shadow = pane && pane.shadowRoot;
        return !!(shadow && shadow.querySelector('flt-scene-host'));
      };
      var timer = setInterval(function () {
        if (painted()) return clearInterval(timer);
      }, 500);

      setTimeout(function () {
        if (painted()) return;
        var panel = document.createElement('div');
        panel.setAttribute('role', 'alert');
        panel.style.cssText =
            'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:14px;padding:28px;' +
            'text-align:center;background:#1A1230;color:#F6F3FF;' +
            'font:14px/1.5 system-ui,-apple-system,sans-serif;';
        panel.innerHTML =
            '<strong style="font-size:17px">THE RADAR could not start</strong>' +
            '<span style="color:#A79BC8;max-width:340px">This is usually a stale ' +
            'cached build. Reload to fetch the current one.</span>' +
            '<button id="radar-reload" style="margin-top:6px;padding:11px 22px;' +
            'border:0;border-radius:999px;background:#7C5CFF;color:#fff;' +
            'font:600 14px/1 system-ui,sans-serif;cursor:pointer">Reload</button>';
        document.body.appendChild(panel);
        document.getElementById('radar-reload').addEventListener('click', function () {
          window.location.reload();
        });
        // If the engine paints late, get out of its way.
        var watch = setInterval(function () {
          if (!painted()) return;
          clearInterval(watch);
          panel.remove();
        }, 500);
      }, 20000);
    })();
  </script>
</body>
</html>
